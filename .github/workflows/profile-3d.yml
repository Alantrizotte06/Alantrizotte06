name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Checkout generator repo
        uses: actions/checkout@v3
        with:
          repository: yoshi38688/github-profile-3d-contrib
          path: generator-src

      - name: Install and Run Generator
        run: |
          cd generator-src
          npm ci
          npm run build
          node dist/index.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: Alantrizotte06

      - name: Move generated files
        run: |
          mkdir -p profile-3d-contrib
          mv generator-src/profile-3d-contrib/* profile-3d-contrib/ || true
          rm -rf generator-src

      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          git commit -m "generated" || exit 0
          git push
